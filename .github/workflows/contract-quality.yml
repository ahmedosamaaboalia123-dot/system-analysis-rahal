name: S01 Contract Quality
on:
  pull_request:
  push:
    branches: ['s02/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-quality:
    name: S01_CONTRACT_QUALITY
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Bootstrap pinned pnpm
        run: npm install --global pnpm@12.19.0
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Existing S01 checks (provisional)
        shell: pwsh
        run: |
          $scripts = @(
            'planning/sprints/S01/validate-s01.ps1',
            'planning/sprints/S01/remediation/validate-remediation.ps1',
            'planning/sprints/S01/root-cause-remediation/run-compatibility-v2.ps1'
          )
          foreach ($script in $scripts) {
            pwsh -NoProfile -File $script
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Redocly and contract acceptance prerequisites
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/s02
          pnpm check:contracts 2>&1 | tee artifacts/s02/contract-quality.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: contract-quality
          path: artifacts/s02/contract-quality.log
